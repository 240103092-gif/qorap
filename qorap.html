<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QORAP — Білімнің цифрлық қорабы</title><style>
:root{--bg:#e4feff;--fg:#0d2f3b;--cd:#fff;--pr:#183f4e;--ac:#183f4e;--onac:#e4feff;--ln:#a5d9e4;--mu:#4a6b76;--hl:#a5f1ff;--logo:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2f3b;--fg:#e4feff;--cd:#183f4e;--pr:#a5f1ff;--ac:#a5f1ff;--onac:#0d2f3b;--ln:#2f6073;--mu:#a5c9d3;--hl:#1f5a6b;--logo:invert(1)}}
:root[data-theme="dark"]{--bg:#0d2f3b;--fg:#e4feff;--cd:#183f4e;--pr:#a5f1ff;--ac:#a5f1ff;--onac:#0d2f3b;--ln:#2f6073;--mu:#a5c9d3;--hl:#1f5a6b;--logo:invert(1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Montserrat",system-ui,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#183f4e,#0d2f3b);color:#e4feff;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font:800 30px/1 "Montserrat",system-ui,sans-serif;letter-spacing:.06em}header p{margin:2px 0 0;font-size:14px;opacity:.85}
button,select,input{font:inherit;color:inherit}button{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px 11px;cursor:pointer}button:hover,button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--ln)}nav button{white-space:nowrap;flex:none}
main{max-width:980px;margin:0 auto;padding:16px 14px 60px}h2{color:var(--pr);margin:6px 0 10px;font-size:26px}h3{color:var(--pr);margin:18px 0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0}.c,.box{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}.c b{color:var(--pr)}.c p{margin:4px 0 0}
.box{margin:12px 0}.w{overflow-x:auto;max-width:100%}table{border-collapse:collapse;background:var(--cd)}td,th{border:1px solid var(--ln);padding:4px 8px;text-align:left}th{background:var(--pr);color:var(--bg)}
details{background:var(--cd);border:1px solid var(--ln);border-radius:8px;margin:5px 0;padding:6px 10px}summary{cursor:pointer;font-weight:600}
.gr td{min-width:74px;height:28px;padding:2px 6px;cursor:cell;user-select:none;white-space:nowrap}.gr th{text-align:center;padding:2px 6px;font-weight:600}.gr td.n{text-align:right}.gr td.c{text-align:center}.gr td.e{color:#d33;font-weight:600}.gr td.s{background:color-mix(in srgb,var(--ac) 22%,var(--cd))}.gr td.a{outline:2px solid var(--ac);outline-offset:-2px}
.tb{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.fb{display:flex;gap:6px;margin-bottom:6px}.fb b{min-width:44px;text-align:center;background:var(--pr);color:var(--bg);border-radius:6px;padding:2px 6px}.fb input,input,select{flex:1;min-width:0;border:1px solid var(--ln);background:var(--cd);border-radius:6px;padding:5px 8px}
.hn{font-size:14px;color:var(--mu);margin:6px 0 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.row input{flex:none;width:100px}.row input[type=color]{width:44px;padding:0}
.bar{padding:7px 10px;border-radius:6px;background:var(--pr);color:var(--bg);margin:3px 0;cursor:pointer}.bar.on{background:var(--ac)}.ok{background:var(--hl);padding:2px 6px;border-radius:5px}
svg{max-width:100%;height:auto;color:var(--fg)}.tree{display:flex;flex-direction:column;align-items:center;gap:6px}.tree div{display:flex;gap:8px}.tree span{border:1px solid var(--ln);background:var(--cd);padding:3px 12px;border-radius:8px}
.gr td input.ci{width:100%;min-width:60px;border:0;background:transparent;padding:0;font:inherit;outline:none;color:inherit}.gr:focus{outline:none}
footer{text-align:center;color:var(--mu);font-size:13px;padding:18px 12px 30px;border-top:1px solid var(--ln)}footer b{color:var(--pr)}

add('Кесте | Кестелік процессор',()=>`<p><b>Кесте (ағыл. table)</b> — деректерді жолдар мен бағандар қиылысында орналастыру арқылы ұсыну тәсілі.</p><p><b>MS Excel</b> — Microsoft Office кестесі қосымшаларының құрамындағы электрондық кестелермен жұмыс істеуге арналған программа. «<b>Кестелік процессор</b>» деп те атайды: кез келген кесте түрін жасауға, қуатты математикалық, статистикалық және қаржылық есептеулер жүргізуге мүмкіндік береді. Жұмысы калькуляторға ұқсас, бірақ мүмкіндігі әлдеқайда жоғары: күрделі есептерді шешуге және санды деректер негізінде диаграмма жасауға болады.</p><h3>Excel-ді қолдану аумағы</h3>${AC([['Есеп құжаттары','Excel парақтары дайын кестелерден тұрады: сабақ кестелері, дүкендердегі прайс парақтары.'],['Диаграмма және график','Ұяшықтағы санды деректерден диаграмма мен графиктер жасауға болады (халықтың өсімі, дүкендерде тауарлардың сатылу динамикасы).'],['Отбасылық есеп','Excel-де отбасының қарапайым есеп-қисабын жүргізуге болады.'],['Деректер базасы','Excel-де деректер базасын құруға болады.']])}<h3>Тарихы</h3>${UL(['Тарихы <b>1985</b> жылдан, <b>Excel 1.0</b> нұсқасынан басталады.','Елімізге <b>1997</b> жылы отандық білім саласын компьютерлендіру кезінде келді.','Елімізде алғаш танымал болған <b>Windows 95</b> жүйесінде <b>Excel 7</b> қолданылды.','Одан кейін: Excel 97, 2000, 2002, 2003, 2007, 2010, 2013, 2016, 2019.'])}<h3>Файл және парақ өлшемі</h3>${TB(['Нұсқа','Бағандар','Жолдар','Кеңейтілім'],[['Excel 2003','255','65 535','*.xls (үш әріп)'],['Excel 2007 бастап','16 384','1 048 576','*.xlsx (төрт әріп)']])}<p>Excel жасайтын файл <b>«Книга — Кітап»</b> деп аталады (Жұмыс кітабы). Кітап жұмыс парақтарынан тұрады: Лист1, Лист2, Лист3… Компьютердің жедел жад көлеміне қарай <b>256 параққа дейін</b> болады. Терезе іске қосылғанда <b>1-парақ екпінді</b>; үнсіздік келісім бойынша кез келген кітап <b>3 парақтан</b> тұрады. Парақтан параққа өту үшін парақ белгісін тінтуірмен шертеміз; белгі көрінбесе, белгілердің сол жағындағы бағыттауышты тінтуір арқылы жылжытамыз.</p><h3>Excel терезесінің бөліктері <small>(басып көріңіз)</small></h3><div class=win id=pt><div class=band data-i=0><i>1</i><div class=bc>Книга1 - Microsoft Excel &nbsp; &nbsp; – ☐ ✕</div><em>Тақырып жолы</em></div><div class=band data-i=1><i>2</i><div class=bc>Главная · Вставка · Разметка страницы · Формулы · Данные · Рецензирование · Вид</div><em>Мәзір жолы</em></div><div class=band data-i=2><i>3</i><div class=bc>Буфер обмена │ Шрифт │ Выравнивание │ Число │ Стили │ Ячейки │ Редактирование</div><em>Құралдар тақтасы</em></div><div class=band data-i=3><i>4</i><div class=bc><b>A1 ▾</b> &nbsp;<b>fx</b> &nbsp;│ формула / мән енгізілетін жол</div><em>Формулалар жолы</em></div><div class=band data-i=4><i>5</i><div class="bc big">A · B · C · D · E (бағандар) &nbsp;/&nbsp; 1 · 2 · 3 · 4 (жолдар)</div><em>Жұмыс парағы</em></div><div class=band data-i=5><i>6</i><div class=bc>Лист1 │ Лист2 │ Лист3 &nbsp; … &nbsp; Готово</div><em>Қалып-күй жолы</em></div></div><p id=pd class=ok>Жоғарыдан төмен қарай санаңыз: әр жолды басып көріңіз.</p><h3>Ұяшық және адрес</h3><p>Жұмыс парағы <b>16 384</b> бағаннан тұрады (латын әріптері A, B, C…), жолдар <b>1-ден 1 048 576-ға</b> дейін нөмірленеді. Баған мен жол қиылысқан тіктөртбұрыш — <b>Ячейка (Ұяшық)</b>. Адрес: A1 — бірінші ұяшық, B2 — B бағанының 2-жолындағы ұяшық. Ұяшықтарға мәтін, сан және формула енгізіледі. Ағымдағы (екпінді) ұяшықты көрсететін ерекше тіктөртбұрыш — <b>кестелік меңзер</b>. Бір мезгілде бір ұяшықпен немесе бірнеше ұяшықтар тобымен жұмыс істеуге болады.</p><div class=box><b>Ұяшықты басып көріңіз:</b><div class=w><table class=gr id=ag></table></div><p id=ai class=ok>Адрес: —</p></div><h3>Командалардың шартты белгілері</h3>${TB(['Команда','Қызметі'],CMD)}`,el=>{const NM=['Тақырып жолы','Мәзір жолы','Құралдар тақтасы','Формулалар жолы','Жұмыс парағы','Қалып-күй жолы'];$$('.band',el).forEach(b=>b.onclick=()=>{$$('.band',el).forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#pd',el).innerHTML=`<b>${+b.dataset.i+1}-жол — ${NM[b.dataset.i]}.</b> ${PARTS[b.dataset.i][1]}`});let h='<tr><th></th>'+[0,1,2,3,4,5].map(c=>`<th>${cn(c)}</th>`).join('')+'</tr>';for(let r=1;r<=6;r++)h+=`<tr><th>${r}</th>`+[0,1,2,3,4,5].map(c=>`<td data-a=${cn(c)}${r} data-c=${cn(c)} data-r=${r}></td>`).join('')+'</tr>';const g=$('#ag',el);g.innerHTML=h;g.onclick=e=>{const t=e.target.closest('td');if(!t)return;$$('td',g).forEach(x=>x.classList.remove('a'));t.classList.add('a');$('#ai',el).textContent=`Адрес: ${t.dataset.a} — ${t.dataset.c} бағаны, ${t.dataset.r}-жол`}});
add('Ұяшықты толтыру ережелері',()=>`${G([['Сан','Санның мәндері бүтін, ондық бөлшек, бөлшек болуы мүмкін. Арнайы символдар қосылуы мүмкін: $, %, +, −, /. Ұяшыққа сыймайтын көптаңбалы сан енгізсек, ұяшықта ####### символдары пайда болады. Санды толық көру үшін бағанды кеңейтеміз.'],['Формулалар','Ұяшық ішіне «=» белгісімен басталатын өрнек енгізсек, Excel оны формула деп қабылдайды. Мысалы: A1=10 және B1=20 болса, B2 ұяшығындағы =A1*B1 формула; нәтижесі B2=200.'],['Мәтін','Сан немесе формула емес, символдар тізбегі мәтін деп қабылданады. Мысалы: «- 985,69» немесе «27-л» — мәтін; «=A1*B1» — формула; «=A*B1+қосу» — мәтін (дұрыс емес формула болып қате шығуы да мүмкін).']])}<div class=box><b>Тексеріп көріңіз:</b> ұяшыққа жазатын мәнді енгізіңіз<div class=row><input id=t1 style="width:200px" value="=A1*B1"><span id=t2 class=ok></span></div><p class=hn>Мәтін — ұяшықтың сол жақ шетіне, сан — оң жақ шетіне туралanады (автоматты түрде).</p></div>`,el=>{const f=()=>{const v=$('#t1',el).value.trim();$('#t2',el).textContent=v==''?'бос':v[0]=='='?'Формула':v[0]=="'"?'Мәтін (апостроф)':!isNaN(+v.replace(',','.'))&&/^[-+]?[\d\s.,$%\/]+$/.test(v)&&!/,/.test(v)?'Сан → оңға туралanады'+(v.replace(/\D/g,'').length>11?' (####### көрсетеді)':''):'Мәтін → солға туралanады'};$('#t1',el).oninput=f;f()});
add('Ұяшықтардың адрестері',()=>`<p>Excel-де ұяшықтың үш түрлі адресі болады: <b>абсолютті, салыстырмалы</b> және <b>аралас</b>. <b>Сілтеме</b> — формула жазу барысында қолданылатын ұяшық, қатар, бағандардың адресі.</p>${UL(['Амалдарды орындауға қатысатын ұяшықтардың адрестері автоматты түрде өзгеріп отырса — <b>салыстырмалы адрестеу</b>. Excel іске қосылғанда адрестер әдетте салыстырмалы болады.','Ұяшық адресі өзгермесе — <b>абсолютті</b>. Абсолютті адрес үшін жол мен баған атауының алдына <b>доллар ($)</b> қойылады (мысалы, $A$2).'])}${TB(['Сілтеме түрі','Оңға қарай толтыру','Төменге қарай толтыру'],[['A1 (салыстырмалы)','B1','A2'],['$A1 (баған бойынша абсолют) — аралас','$A1','$A2'],['A$1 (жол бойынша абсолют) — аралас','B$1','A$1'],['$A$1 (абсолют)','$A$1','$A$1']])}<div class=box><b>Өзіңіз сынаңыз:</b><div class=row><input id=ar value="=A1*$B$1" style="width:180px"><button id=ar1>→ оңға ×1</button><button id=ar2>↓ төмен ×1</button><button id=ar3>→ ×4</button><button id=ar4>↓ ×4</button></div><p id=ao class=ok>Формуланы жазып, толтыру батырмасын басыңыз.</p><p class=hn>1) Кестеден бастапқы ұяшықты басыңыз (көк жиекті). 2) Толтыру батырмасын басыңыз: формула көрші ұяшықтарға бір-бірлеп жылжып түседі, сары түспен сол формула сілтейтін ұяшықтар көрсетіледі.</p><div class=w><table class=gr id=ag2></table></div></div>`,el=>{const C=7,R=7,g=$('#ag2',el),fe=$('#ar',el);let src=[2,2],tm=[];const refs=f=>[...f.matchAll(/(\$?)([A-Za-z\u0410-\u044f]{1,3})(\$?)(\d+)/g)].map(m=>{let c=0;for(const ch of nm(m[2]))c=c*26+ch.charCodeAt(0)-64;return(c>0&&+m[4]>0)?[c-1,+m[4]-1]:null}).filter(Boolean);
const dr=(fill,hl)=>{let h='<tr><th></th>'+[...Array(C)].map((_,c)=>`<th>${cn(c)}</th>`).join('')+'</tr>';for(let r=0;r<R;r++){h+=`<tr><th>${r+1}</th>`;for(let c=0;c<C;c++){const k=c+','+r,S=c==src[0]&&r==src[1],H=hl.some(x=>x[0]==c&&x[1]==r);h+=`<td data-c=${c} data-r=${r} class="${S?'a ':''}${fill[k]?'s ':''}${H?'rf':''}">${S?fe.value:fill[k]||''}</td>`}h+='</tr>'}g.innerHTML=h};
const run=(dc,dr2,n)=>{tm.forEach(clearTimeout);tm=[];const f0=fe.value,fill={};dr(fill,refs(f0));let i=1;const st=()=>{const c=src[0]+dc*i,r=src[1]+dr2*i;if(c>=C||r>=R){$('#ao',el).textContent='Кесте шетіне жеттік.';return}const f=sh(f0,dc*i,dr2*i);fill[c+','+r]=f;dr(fill,refs(f));$('#ao',el).textContent=`${f0}  →  ${f}`;if(++i<=n)tm.push(setTimeout(st,550))};tm.push(setTimeout(st,250))};

add('Электрондық кестенің элементтерін форматтау',()=>{const F6=[['Защита (Қорғау)','ұяшыққа жазылған мәліметті өшіп қалудан немесе мәнінің ауысып кетуінен сақтайды.'],['Число (Сан)','ұяшықты алдын ала сан, ақша, қаржы, мерзім, уақыт, процент, бөлшек және мәтіндік деректерге арнап қоюға болады. Ұяшыққа қандай сан жазсақ та, ол өзінің бастапқы форматын сақтайды (мысалы, мерзім форматында басқа дерек жазсақ та, мерзім түрінде көрінеді).'],['Выравнивание (Туралау, теңестіру)','деректерді оңға, ортаға, солға, еніне, жоғары және төмен қарай туралайды; мәтінді тасымалдауға, ұяшықтарды біріктіруге, ұяшықтың бағытын өзгертуге мүмкіндік береді.'],['Шрифт (Қаріп)','деректердің түсін өзгертуге, сандарды дәреже мен индекс түрінде жазуға, сызуға немесе өлшемін өзгертуге болады.'],['Граница (Шегара, жиек)','ұяшықты шегаралау арқылы кесте жасаймыз. Шегара қойылмаса, принтерден шығарғанда ұяшықтардың шегаралары көрінбей қалады. Шегара түсін өзгертіп, алып тастауға да болады.'],['Заливка (Құйып бояу)','бір ұяшықтың немесе толық кестенің түсін өзгертеді.']];return`<p>Ұяшықты форматтау терезесі <b>6 бөлімнен</b> тұрады:</p>${AC(F6.map(x=>[x[0],x[1]]))}<div class=box><b>Практика: ұяшықты форматтаңыз</b><div class=row><select id=fa><option value=left>Сол жаққа</option><option value=center>Ортаға</option><option value=right>Оң жаққа</option></select><select id=ft><option value="Calibri,Carlito,sans-serif">Calibri</option><option value="Arial,Helvetica,sans-serif">Arial</option><option value="'Times New Roman',Times,serif">Times New Roman</option><option value="'Courier New',monospace">Courier New</option></select><select id=fs><option>14</option><option>18</option><option>26</option></select><select id=fx><option value=none>Қалыпты</option><option value=sup>Дәреже (x²)</option><option value=sub>Индекс (H₂)</option></select></div><div class=row><label><input type=checkbox id=fb> Қалың</label><label><input type=checkbox id=fu> Сызу</label><label><input type=checkbox id=fr> Шегара</label> Қаріп түсі <input type=color id=fc value="#173f4f"> Заливка <input type=color id=ff value="#ffffff"></div><div class=w><table><tr><td id=fp style="width:100%;min-width:260px;height:70px">Excel 2007 H2O 10 2</td></tr></table></div></div>`},el=>{const f=()=>{const p=$('#fp',el),g=i=>$('#'+i,el);p.style.cssText=`font-family:${g('ft').value};text-align:${g('fa').value};font-size:${g('fs').value}px;font-weight:${g('fb').checked?800:400};text-decoration:${g('fu').checked?'underline':'none'};color:${g('fc').value};background:${g('ff').value};border:${g('fr').checked?'3px solid #d33':'1px solid var(--ln)'};vertical-align:${g('fx').value=='sup'?'top':g('fx').value=='sub'?'bottom':'middle'}`;p.innerHTML=g('fx').value=='sup'?'x<sup>2</sup> = 25':g('fx').value=='sub'?'H<sub>2</sub>O':'Excel 2007'};$$('select,input',el).forEach(x=>x.oninput=f);f()});
add('Ұяшықтарды өшіру, тазалау, көшіру және қою',()=>`${AC([['Деректерді өшіру','Ұяшықтағы немесе ұяшықтар тобындағы деректерді өшіру үшін оларды ерекшелеп, пернетақтадағы <b>Delete</b> пернесін басамыз немесе <b>Редактирование (Редакциялау)</b> бөліміндегі <b>Очистить (Тазалау)</b> командасын таңдаймыз.'],['Парақты, баған мен қатарды өшіру','Алдымен ерекшелеп, содан кейін <b>Ячейки (Ұяшық) ⇒ Удалить (Өшіру)</b> командасын орындаймыз. Өшірілген объектілердің орны бос қалмайды: төменгі жолдағы немесе оң жақтағы бағандағы деректер жоғары не солға жылжып, орнын толтырады.'],['Көшіру және қою','Мәліметті басқа ұяшыққа көшіру үшін <b>Вырезать (Қиып алу)</b> немесе <b>CTRL+X</b>. Көшіріп алу үшін <b>Копировать (Көшіру)</b> немесе <b>CTRL+C</b>. Қою үшін <b>Вставить (Кірістіру)</b> немесе <b>CTRL+V</b>.']])}<div class=box><b>Delete пен Удалить айырмасы:</b> тізімнен 2-элементті өшіріп көріңіз<div class=row><button id=d1>Delete (тек мәнді өшіру)</button><button id=d2>Удалить (жылжыту)</button><button id=d3>↺</button></div><div id=dl class=row></div></div><h3 class=mv>Парақта тәжірибе жасаңыз</h3>${SP('s5',{A1:'10',A2:'20',A3:'=A1+A2',B1:'Excel'},8,5,[0,0],'A1:A3 таңдап Көшіру → C1 таңдап Қою; формулалар адресі автоматты өзгеретінін көріңіз.')}`,el=>{let L;const r=()=>{L=['A','B','C','D'];s()},s=()=>$('#dl',el).innerHTML=L.map(x=>`<span class=ok style="min-width:40px;text-align:center">${x||'∅'}</span>`).join('');r();$('#d1',el).onclick=()=>{L[1]='';s()};$('#d2',el).onclick=()=>{L.splice(1,1);s()};$('#d3',el).onclick=r});
add('Деректер типтері',()=>`<p>Кестенің ұяшықтарына деректердің үш типінің біреуін ғана енгізе аламыз: <b>сан, формула, мәтін</b>. Сан <b>сандық, ақшалай, мерзімдік</b> болып бөлінеді.</p><div class=tree><span><b>Деректер типтері</b></span><div><span>формула</span><span>сан</span><span>мәтін</span></div><div><span>сандық</span><span>ақшалай</span><span>мерзімдік</span></div><small>(үш сан түрі — «сан» тармағынан)</small></div><p>Егер енгізілетін символдар тек цифрлардан құралса, оны сандық типке жатқызамыз.</p>${AC([['Жалпы (Общий)','ағымдағы формат.'],['Сандық (Числовой)','бүтін немесе нақты сандарды көрсету форматы.'],['Пайыздық (Процентный)','нақты сандарды пайыз түрінде көрсету.'],['Бөлшектік (Дробный)','нақты сандарды бөлшек түрінде беру.'],['Барлық форматтар (Все форматы)','сандардың берілу типін түрлендіріп жазуға болады. Мысалы, 13.01.23 күні ДД.ММ.ГГ түрінде көрінеді, егер МММ.ГГ деп өзгертсек, «13 қантар» деп көрсетіледі.'],['Ақшалы (Денежный)','сандарды ақша бірлігінде көрсету.'],['Күні/уақыт (Дата/время)','санды күні/уақыт бірліктерінде көрсету. Күн сан түрінде 01.01.1900 бастапқы уақытынан өткен күндер санын білдіреді (мысалы, 08.02.2020 → 43869). 01.01.1900 күнінен бұрынғы күндер Excel-де мәтін ретінде беріледі.'],['Мәтін ережелері','Бірінші символымыз әріп немесе апостроф (’) болса, типі мәтін. Бір ұяшыққа <b>32767</b> символға дейін енгізіледі (стандартты мәтіндік редакторда 30 бет файл). Қарапайым мәтін ұяшықтың <b>сол жақ шеті</b> бойынша, сан <b>оң жақ шеті</b> бойынша реттеледі.'],['Енгізу және болдырмау','Деректерді <b>Enter</b> басып енгіземіз. Енгізілген деректерді алып тастап, бастапқы мәнді қалпына келтіру үшін <b>Esc</b> немесе формулалар жолындағы <b>Болдырмау (Отмена)</b> батырмасы.'],['Сандық формат','Математикалық және қаржылық есептерде кәдімгі сандық, қаржылық және мерзімдік формат қолданылады. Кәдімгі сандық формат әртүрлі санды шамаларды жазуға арналған (тауар саны, процент, жас мөлшері). Ақша сомасы — қаржылық форматта. Уақыт мезгілі — мерзімдік форматта.'],['Мәтіндік формат','Мәтіндік жолдармен және цифрлармен көрсетілген сандық емес деректер үшін: тіркеу нөмірлері, пошта индексі, телефон нөмірі.']])}<div class=box><b>Формат түрлендіргіш:</b> санды енгізіңіз<div class=row><input id=cv type=number value=43869></div><div id=co></div></div>`,el=>{const fr=x=>{let b=1,bd=1,e=1e9;for(let d=1;d<=100;d++){const n=Math.round(x*d);if(Math.abs(x-n/d)<e){e=Math.abs(x-n/d);b=n;bd=d}}return b+'/'+bd};const f=()=>{const x=+$('#cv',el).value,d=new Date(Date.UTC(1899,11,30)+x*864e5),p=n=>String(n).padStart(2,'0');$('#co',el).innerHTML=TB(['Формат','Көрінісі'],[['Жалпы',x],['Сандық',x.toFixed(2)],['Пайыздық',(x*100).toFixed(0)+'%'],['Бөлшектік',fr(x%1?x:x)],['Ақшалы',x.toLocaleString('ru')+' ₸'],['Күні (ДД.ММ.ГГГГ)',x>0?`${p(d.getUTCDate())}.${p(d.getUTCMonth()+1)}.${d.getUTCFullYear()}`:'—'],['Мәтіндік',"'"+x]])};$('#cv',el).oninput=f;f()});
add('Автотолтыру',()=>`<p>Excel-дегі <b>Автотолтыру</b> — кестені сандармен толтыруға, формулаларды автоматты қолдану мен есеп жүргізуге өте ыңғайлы функция. Қалған ұяшықтарға формуланы автотолтыру арқылы жылдам есептеуге болады. Сан, күн, тоқсан тізімін дайындауға болады.</p><h3>Автотолтырудың 3 жағдайда қолданылуы</h3>${UL(['Баған немесе жолдардың ұяшықтарын <b>бірдей деректермен</b> толтыруда. Мысалы, 500, 500, 500, 500, …','Баған мен ұяшықтарды <b>белгілі бір интервалдағы санмен</b> толтыруда. Мысалы, тақ сандармен: 1, 3, 5, 7, 9…','Қатар тұрған ұяшықтарда <b>бір формула</b> көмегімен автоматты түрде есептеулер жүргізуде: бір ұяшыққа формула жазу жеткілікті.'])}<div class="box mv"><b>Практика:</b> A1:A2 (1 және 3) ұяшықтарын таңдап «↓ Автотолтыру» басыңыз → 5, 7, 9… B1 (500) таңдап басыңыз → бірдей мән. C1:C2 формулаларын таңдап толтырыңыз.</div>${SP('s7',{A1:'1',A2:'3',B1:'500',D1:'2',E1:'5',F1:'=D1*E1'},9,6,[0,0],'')}`);
add('Ай, апта, күн тізімін енгізу тәсілі',()=>`${UL(['Ұяшыққа бірінші элементті енгізіп, <b>Enter</b> басамыз немесе формула жолындағы енгізу батырмасын басамыз.','Тінтуірдің көрсеткішін басқарушы элементке қойып, оны сол жақ төменгі бұрышынан төменге қарай жылжытамыз.','Тізімге кіретін барлық ұяшық көкшіл түспен ерекшеленеді, бірінші ұяшықтағы дерек немесе мән ақ түсте қалады.','Тінтуірдің батырмасын босатып, тізімді дайындауды аяқтаймыз.'])}<div class=box><b>Тізімді өзіңіз жасаңыз:</b> бірінші элементті жазыңыз (Қаңтар, Январь, Дүйсенбі, Понедельник, Jan, Mon)<div class=row><input id=ml value=Қаңтар><input id=mn type=number value=6 style="width:70px"></div><div id=mo class=row></div></div><p class=hn>Жоғарыдағы «Автотолтыру» парағында да осы тізімдерді (A1 ұяшығына жазып) тартып көріңіз.</p>`,el=>{const f=()=>{const v=$('#ml',el).value,n=+$('#mn',el).value||1,l=lst(v);$('#mo',el).innerHTML=[v,...(l?gen([v],n-1,0,1):Array(n-1).fill(v))].map(x=>`<span class=ok>${x}</span>`).join('')};$('#ml',el).oninput=$('#mn',el).oninput=f;f()});
const SC=[['Бағасы',0],['Саны',1]],TXT=[['Қазақ тілі',1700,110],['Алгебра',2000,90],['Физика',1800,25],['Химия',1600,60],['Информатика',1500,100],['Орыс тілі',1650,50],['Биология',2100,78],['Геометрия',1400,80],['География',2000,60],['Қазақстан тарихы',1900,70]];
add('Шартты форматтау',()=>`<p><b>Шартты форматтау</b> — ұяшықтардағы деректерді белгілі шарттар бойынша форматтау (кесте мәндерін ерекшелеу құралы немесе мәтіннің сыртқы түрін өзгерту процесі). Санды деректерді <b>гистограмма, таңбалар және әртүрлі түстермен</b> беру тиімді: проблемалық жерлерге бірден визуалды баға беруге болады.</p><p>Іске қосу: <b>Главная (Басты)</b> → <b>Стили (Мәнерлер)</b> → <b>Условное форматирование</b>.</p>${AC([['Правила выделения ячеек (Ұяшықтарды ерекшелеу ережесі)','нақты мәндері бар ұяшықтарды форматтау ережесін жасайды: Больше, Меньше, Между, Равно, Текст содержит, Дата, Повторяющиеся значения.'],['Правила отбора первых и последних значений (Бірінші және соңғы мәндерді іріктеу)','10 первых элементов, Первые 10%, 10 последних элементов, Последние 10%, Выше среднего, Ниже среднего.'],['Гистограммы','таңдалған ұяшықтардағы мәндерді көру ыңғайлы болуы үшін әртүрлі түсті гистограммалар қояды (градиентная / сплошная заливка).'],['Цветовые шкалы (Түрлі түсті шәкілдер)','орналасқан мәндеріне қарай ұяшықтарды екі немесе үш түске бояу арқылы ерекшелейді.'],['Набор значков (Таңбалар жиынтығы / Белгішелер жинақтары)','ұяшықтағы мәнді басқа ұяшықтардағы мәндермен салыстыру арқылы таңба анықталады.'],['Создать правило… (Ереже құру)','пайдаланушы өзі форматтау шартын ұсынатын «Форматтаудың жаңа ережесін құру» терезесін ашады.'],['Удалить правила (Ережені өшіру)','ұяшыққа/параққа берілген ережелерді өшіреді.'],['Управление правилами… (Ережелерді басқару)','«Шартты форматтау ережелер диспетчері»: ережелерге өзгеріс енгізуге, өшіруге, тізімде жоғары-төмен жылжытуға болады.']])}<div class=box><b>Практика.</b> Бағанды таңдаңыз, ережені басыңыз:<div class=row><select id=cc><option value=1>Бағасы</option><option value=2>Саны</option><option value=0>Оқулық атауы (мәтін)</option></select> Мән 1 <input id=p1 type=number value=1850> Мән 2 <input id=p2 type=number value=2000> N <input id=pn type=number value=5> Мәтін <input id=pt2 value=тіл></div><div class=tb id=cb></div><div class=w><table id=ct></table></div></div>`,el=>{const R={};const B=[['gt','Больше…'],['lt','Меньше…'],['bt','Между…'],['eq','Равно…'],['tx','Текст содержит…'],['dp','Повторяющиеся'],['t1','N первых'],['t2','N последних'],['p1','Первые 10%'],['p2','Последние 10%'],['av','Выше среднего'],['bw','Ниже среднего'],['hs','Гистограмма'],['cs','Цветовая шкала'],['ic','Набор значков'],['cl','Удалить правила']];$('#cb',el).innerHTML=B.map(x=>`<button data-r=${x[0]}>${x[1]}</button>`).join('');const PK='background:#f4b6c0;color:#9c0006',GR='background:#c6efce;color:#006100';
const rd=()=>{const T=$('#ct',el);T.innerHTML='<tr><th>қ/с</th><th>Оқулық атауы</th><th>Бағасы</th><th>Саны</th></tr>'+TXT.map((r,i)=>`<tr><td>${i+1}</td>${[0,1,2].map(c=>`<td data-c=${c} data-i=${i} style="${st(c,i,r)[0]}">${st(c,i,r)[1]}</td>`).join('')}</tr>`).join('')};
const st=(c,i,r)=>{const v=r[c],ru=R[c];if(!ru)return['',v];const col=TXT.map(x=>x[c]),p1=+$('#p1',el).value,p2=+$('#p2',el).value,n=+$('#pn',el).value,mn=Math.min(...col),mx=Math.max(...col),avg=col.reduce((s,x)=>s+x,0)/col.length,so=[...col].sort((a,b)=>b-a),k=(v-mn)/(mx-mn||1);

add('Диаграммалар',()=>`<p><b>Диаграмма</b> — санды деректердің ерекшеліктерін визуалды қабылдауға ыңғайлы, түсінуге жеңіл етіп график түрінде ұсыну әдісі. Диаграмма құрғанда немесе өзгерткенде әртүрлі түрін (гистограмма, дөңгелек…) таңдауға болады; қосымша түрлері де бар (жинақтау гистограммасы, үшөлшемдік секторлық диаграмма). Бірнеше түрін пайдаланып <b>аралас диаграмма</b> құрады.</p><p>Құру: мәзірдегі <b>Вставка (Кірістіру)</b> → <b>Диаграммалар</b> бөліміндегі құралдар тақтасы: Гистограмма, График, Круговая (Дөңгелек), Линейная (Сызықтық), С областями (Аймақтармен), Точечная (Нүктелік), Другие (Басқа да).</p><p>Құрғаннан кейін кез келген элементін өзгертуге болады: <b>Макет</b> → <b>Подписи (Қолтаңбалар)</b>: диаграмма атауы (Название диаграммы), осьтер атауы (Название осей), аңыз (Легенда), деректер мәнін қою (Подписи данных), деректер кестесі (Таблица данных).</p><div class=box><b>Деректер:</b> Информатика 46, Математика 50, Физика 41, Химия 43, Биология 58, Информатика 50, Информатика 50, Тарих 33, Математика 45, Физика 56<div class=tb id=ctb>${CT.map(x=>`<button data-t=${x[0]}>${x[1]}</button>`).join('')}</div><div class=row><label><input type=checkbox id=k1 checked> Диаграмма атауы</label><label><input type=checkbox id=k2> Осьтер атауы</label><label><input type=checkbox id=k3 checked> Аңыз</label><label><input type=checkbox id=k4> Деректер мәнін қою</label><label><input type=checkbox id=k5> Деректер кестесі</label></div><div class=w id=cv2></div></div><h3>Диаграмма түрлері</h3>${TB(['Диаграмма түрлері','Қазақша'],[['Гистограмма','Гистограмма'],['График','Графика'],['Круговая','Дөңгелек'],['Линейная','Сызықтық'],['С областями','Аймақтарымен'],['Точечная','Нүктелермен'],['Биржевая','Биржалық'],['Поверхность','Үстіңгі бөліктер'],['Лепестковая','Жапырақша тәрізді'],['Древовидная','Тармақталған (ағаш)'],['Солнечные лучи','Күн сәулесі тәрізді']])}<p class=hn>Дөңгелек диаграмманың ішкі түрлері: дөңгелек, үшөлшемді дөңгелек, дөңгелек-дөңгелек, дөңгелек-тілімді, сақина.</p><h3>Модель және модельдеу</h3>${G([['Модель','нақты объектінің, құбылыстың немесе процестің қарапайым түрде берілуі.'],['Модельдеу','объектілерді, процестерді және құбылыстарды зерделеу мен зерттеу үшін модельді құрастыру процесі.']])}`,el=>{let t='col';const f=()=>{$('#cv2',el).innerHTML=chart(t,{t:$('#k1',el).checked,x:$('#k2',el).checked,l:$('#k3',el).checked,d:$('#k4',el).checked,tb:$('#k5',el).checked});$$('#ctb button',el).forEach(b=>b.classList.toggle('on',b.dataset.t==t))};$('#ctb',el).onclick=e=>{const b=e.target.closest('button');if(b){t=b.dataset.t;f()}};$$('input',el).forEach(x=>x.onchange=f);f()});
add('Формула',()=>`<p><b>Формула жолы</b> — парақ ұяшықтарындағы мәтін мен формулаларды енгізу және өзгерту үшін қолданылатын панель. Кез келген формула <b>«=»</b> символынан басталады.</p>${UL(['Ұяшыққа <b>4+3</b> енгізілсе — программа жай мәтін/сан ретінде қабылдайды, формула жолында дәл осылай көрсетеді.','<b>=4+3</b> түрінде енгізілсе — формула; формула жолында өрнек, ұяшықта нәтиже (7) жазылады.','Мәтінді формулаға <b>қос тырнақшаға</b> алып енгіземіз: <b>=Компьютер</b> — қате (#Имя?), ал <b>="Компьютер"</b> — дұрыс формула.','Ұяшық адресін қолмен жазудың қажеті жоқ: «=» белгісінен кейін ұяшықты тінтуірмен шертуге немесе ұяшықтар ауқымын таңдауға болады.','Формулада бірнеше сілтеме болса, Excel әрқайсысына әртүрлі түс береді (мысалы, C2 ұяшығындағы =A2+B2 — екі рет шерткенде түрлі түсті сілтемелер мен сәйкес түсті жиектер көрінеді).'])}<p>Формулада әртүрлі операторлар қолданылады: мәтін, ұяшыққа сілтемелер, арифметикалық, логикалық, анықтамалық операторлар, екі мәтінді біріктіретін операторлар және жақшалар.</p>${SP('s11',{A2:'10',B2:'20'},7,5,[2,1],'C2 ұяшығына =A2+B2 жазып көріңіз; кейін =4+3, =Компьютер, ="Компьютер" салыстырыңыз.')}`);
add('Операторлар',()=>`<p>Операторлар <b>бинарлы</b> (қос мәнмен жұмыс істейді, мысалы «*» сол жақтағы санды оң жақтағы санға көбейтеді) және <b>унарлы</b> (бір мәнмен: «+» мәнді өзгеріссіз қалдырады, «−» санның таңбасын қарама-қарсыға өзгертеді) болып екіге бөлінеді.</p><h3>Арифметикалық</h3>${TB(['Оператор','Мағынасы','Мысал'],[['+','қосу','=5+5'],['-','азайту','=5-5'],['*','көбейту','=3*5'],['/','бөлу','=6/3'],['^','дәрежеге шығару','=2^10'],['%','пайыз','=3% → 0,03']])}<h3>Логикалық (салыстыру)</h3>${TB(['Оператор','Мағынасы'],[['&gt;','үлкен'],['&lt;','кіші'],['&gt;=','үлкен немесе тең'],['&lt;=','кіші немесе тең'],['=','тең (теңдікті тексереді)'],['&lt;&gt;','тең емес (теңсіздікті тексереді)']])}<h3>Анықтамалық</h3>${UL(['<b>«:»</b> (қос нүкте) — екі ұяшық сілтемесі арасына қойылады, ауқым сілтемесі (A1:A15).','<b>«;»</b> (нүктелі үтір) — бірнеше сілтемені біріктіреді: SUM(A1:A15; B1:B15).','<b>( )</b> (бос орын) — қиылысу операторы: екі ауқымның жалпы ұяшықтарына сілтеме (B7:D7 C6:C8).'])}<h3>Мәтінді біріктіру</h3><p><b>«&amp;»</b> (амперсанд) екі ұяшықтағы мәтінді «желімдейді». A2-ге «Компьютер», C2-ге «жады» енгізіп, D2-ге <b>=A2&amp;C2</b> жазсақ, «Компьютержады» шығады.</p>${SP('s12',{A2:'Компьютер',C2:'жады',B4:'7',C4:'3'},8,5,[3,1],'D2 ұяшығына =A2&C2 жазыңыз. Басқа мысалдар: =2^10, =3%, =B4>=C4, =-B4, =СУММ(B4:C4 C4:C5).')}`);

анын есептейді','=СЧЁТЕСЛИ(A1:A5;">3")'],['Статистикалық','КОРРЕЛ (массив1; массив2)','корреляция коэффициенті R','=КОРРЕЛ(A1:A5;D1:D5)'],['Логикалық','ЕСЛИ (ЕГЕР) (логикалық_өрнек; мән1; мән2)','шарт ақиқат болса 1-мән, әйтпесе 2-мән. Мысалы: C1=30000 болса, =ЕСЛИ(C1<20000;12;15) нәтижесі 15, себебі шарт орындалмайды','=ЕСЛИ(C1<20000;12;15)'],['Логикалық','И (ЖӘНЕ) (шарт1; шарт2; …)','барлық аргумент АҚИҚАТ болса — ИСТИНА, әйтпесе ЛОЖЬ','=И(C1>=20000;C1<40000)'],['Логикалық','ИЛИ (НЕМЕСЕ) (шарт1; шарт2; …)','кемінде біреуі АҚИҚАТ болса — ИСТИНА, әйтпесе ЛОЖЬ','=ИЛИ(C1<20000;C1>25000)'],['Логикалық','Кірістірілген ЕСЛИ + И','=ЕСЛИ(И(A1>=20000;A1<40000);15;18): A1 20000–40000 аралығында болса 15, әйтпесе 18','=ЕСЛИ(И(C1>=20000;C1<40000);15;18)'],['Логикалық','Кірістірілген ЕСЛИ','=ЕСЛИ(A1<20000;12;ЕСЛИ(A1<40000;15;18)): A1<20000 → 12; A1<40000 → 15; әйтпесе 18','=ЕСЛИ(C1<20000;12;ЕСЛИ(C1<40000;15;18))']];
add('Функциялар',()=>`<p>Microsoft Excel-дің <b>функциясы</b> — белгілі бір алгоритм немесе формулалар бойынша жүргізілетін есептеу операциясы. Әрбір функцияның өзіне тән атауы болады. Функция аттары пернетақтадан теріліп жазылады, немесе <b>Формулы (Формулалар) ⇒ Библиотека функций (Функция кітапханасы)</b> командасы, не саймандар панеліндегі <b>fx Вставить функцию (Функцияны кірістіру)</b> батырмасы арқылы енгізіледі.</p><p>Excel-де күрделі мен қарапайым есептеулерге арналған <b>200-ден аса</b> кірістірілген функция бар; сондай-ақ <b>VBA</b> программалау мүмкіндігімен өзіңе қажет функцияларды құруға болады. Логикалық функциялар шарттың орындалу нәтижесіне байланысты қызмет етеді (=, &gt;, &lt;, &lt;&gt;, &gt;=, &lt;= операциялары).</p><div class=tb id=fc>${['Математикалық','Мәтіндік','Статистикалық','Логикалық'].map(x=>`<button data-c=${x}>${x}</button>`).join('')}</div><div id=fl></div><h3 class=mv>Практика парағы</h3><p class="hn mv">A1:A5 — сандар, B1:B2 — мәтін, C1 — 30000, D1:D5 — сандар. Функцияның «Парақта сынау» батырмасы формуланы таңдалған ұяшыққа жазады.</p>${SP('s13',{A1:'4',A2:'-9',A3:'16',A4:'25',A5:'3.7',B1:'КОМПЬЮТЕР',B2:'Excel',C1:'30000',D1:'2',D2:'5',D3:'3',D4:'8',D5:'6'},9,7,[5,0],'')}`,el=>{const f=c=>{$$('#fc button',el).forEach(b=>b.classList.toggle('on',b.dataset.c==c));$('#fl',el).innerHTML=FN.map((x,i)=>x[0]==c?`<details><summary>${x[1]}</summary><p>${x[2]}</p><p><code>${x[3].replace(/</g,'&lt;')}</code> <button data-i=${i}>Парақта сынау</button></p></details>`:'').join('')};$('#fc',el).onclick=e=>{const b=e.target.closest('button');if(b)f(b.dataset.c)};$('#fl',el).onclick=e=>{const b=e.target.closest('button');if(b)SH.s13.put(FN[b.dataset.i][3])};f('Математикалық')});
const ER=[['#Дел/0!','Нөлге бөлу берілген','=1/0'],['#Знач!','Қате аргумент немесе оператор енгізілген','="а"+1'],['#Имя?','Мүмкін емес мән көрсетілген (аты танылмайды)','=Компьютер'],['#Н/Д','Мән берілмеген','=НД()'],['#Пусто!','Қиылыспайтын ұяшықтар аймағы көрсетілген','=СУММ(A1:A2 C1:C2)'],['#Ссылка!','Қате сілтеме берілген','=A0'],['#Число!','Мәнді алу барысындағы қателік','=КОРЕНЬ(-1)']];
add('Қате түрлері',()=>`<p>Егер ұяшықтағы формуланы программа дұрыс анықтай алмаса, ұяшықта төмендегі қателердің бірі бейнеленеді. «Қатені шығару» батырмасын басып көріңіз:</p>${TB(['Қате','Мағынасы','Мысал',''],ER.map((x,i)=>[`<b style=color:#d33>${x[0]}</b>`,x[1],`<code>${x[2]}</code>`,`<button data-i=${i}>Қатені шығару</button>`]))}${SP('s14',{A1:'1',A2:'2',C1:'5',C2:'6'},6,5,[4,0],'')}`,el=>el.onclick=e=>{const b=e.target.closest('button[data-i]');if(b)SH.s14.put(ER[b.dataset.i][2])});
const TR=[[30,67],[42,88],[57,92],[69,120],[75,145],[87,184],[95,199],[100,228]];
add('Тренд, корреляция, болжау',()=>`${G([['Болжам','«болжау», «аян беру» деген мағына береді. <b>Болжау</b> — болашақ оқиғаның немесе құбылыстың ғылыми моделі. <b>Болжамдау</b> — болжауды жобалау кезеңі.'],['Болжау әдістері','статистикалық әдіс; эксперттік бағалау (дельфи әдісі); модельдеу.'],['Тренд сызығының түрлері','диаграммаға тренд сызығын қосқанда алты түрін таңдауға болады: сызықтық, логарифмдік, полиномдық, дәрежелік, жылжымалы орташа мән, экспоненциалдық.']])}<h3>Сызықтық тренд</h3><p>Тұрақты жылдамдықпен өсетін немесе кемитін модельдерді сипаттауға қолайлы болжаудың қарапайым түрі. Нүктелер түзу сызыққа жақын орналасқанда өте қолайлы; екі шаманың өзара байланыс заңдылығын бағалауға қолданылады. Сызықтық функция коэффициенті <b>ең кіші квадраттар әдісімен</b> анықталады.</p><p><b>R-квадрат</b> — сенімділік коэффициенті: болжаудың дәлдігін көрсетеді. R² = 1 немесе 1-ге жақын болса, тренд сызығы деректерге дәл келеді, яғни болжау дұрыс. Excel оны автоматты есептейді, қажет болса диаграммада көрсетуге болады.</p><h3>Корреляция</h3><p><b>Корреляциялық тәуелділік</b> — бір шаманың өзгеруінен екінші шаманың орта мәні өзгеретін статистикалық тәуелділік. Excel-де <b>КОРРЕЛ</b> функциясы бар, мәні <b>R</b> деп белгіленеді. Көне лат. <i>correlatio</i> — «арақатыс», «өзара байланыс». <b>R &gt; 0</b> — оң мәнге өсетін байланыс, <b>R &lt; 0</b> — теріс (кемуші) байланыс. R 1-ге жақындаған сайын байланыс сызығы түзуге жақын. Мұнда R = 0,96704012 — сызықтық байланыс айқын.</p><p>Болжау үшін <b>ПРЕДСКАЗ</b> функциясы (статистикалық): <code>=ПРЕДСКАЗ(x; y-тің белгілі мәндер аралығы; x-тің белгілі мәндер аралығы)</code>. x орнына болжам жасалатын 120 мәні қойылады — нәтиже 254,657849.</p><div id=tr></div>${SP('s15',{A2:'Жарияланған мақала саны',B2:'Көрушілер саны',...Object.fromEntries(TR.flatMap((r,i)=>[['A'+(i+3),r[0]],['B'+(i+3),r[1]]])),A12:'R =',B12:'=КОРРЕЛ(A3:A10;B3:B10)',A13:'x=120',B13:'=ПРЕДСКАЗ(120;B3:B10;A3:A10)'},14,3,[0,13],'Мәндерді өзгертіп, R мен болжамның қалай өзгеретінін қараңыз.')}`,el=>{const n=TR.length,mx=TR.reduce((s,r)=>s+r[0],0)/n,my=TR.reduce((s,r)=>s+r[1],0)/n;let sx=0,sxy=0;TR.forEach(r=>{sx+=(r[0]-mx)**2;sxy+=(r[0]-mx)*(r[1]-my)});const k=sxy/sx,b0=my-k*mx,X=x=>40+x/130*320,Y=y=>180-y/260*160;$('#tr',el).innerHTML=`<svg viewBox="0 0 380 200"><line x1=40 y1=180 x2=360 y2=180 stroke=currentColor /><line x1=40 y1=20 x2=40 y2=180 stroke=currentColor /><line x1=${X(20)} y1=${Y(b0+k*20)} x2=${X(125)} y2=${Y(b0+k*125)} stroke="#ED7D31" stroke-width=2 />${TR.map(r=>`<circle cx=${X(r[0])} cy=${Y(r[1])} r=4 fill="#5B9BD5" />`).join('')}<circle cx=${X(120)} cy=${Y(b0+k*120)} r=5 fill="#70AD47" /><text x=${X(120)-40} y=${Y(b0+k*120)-9} font-size=10 fill=currentColor>болжам ≈ ${(b0+k*120).toFixed(2)}</text><text x=50 y=34 font-size=11 fill=currentColor>Сызықтық тренд (тренд сызығы)</text></svg>`});
SEC.forEach(x=>x.sp=['Ұяшықтарды өшіру, тазалау, көшіру және қою','Автотолтыру','Формула','Операторлар','Функциялар','Қате түрлері','Тренд, корреляция, болжау'].includes(x.t));const nav=$('#nav'),main=$('#main');nav.innerHTML=SEC.map((s,i)=>`<button data-i=${i}>${i+1}. ${s.t}</button>`).join('');
const go=i=>{const s=SEC[i];main.innerHTML=`<h2>${s.t}</h2>${s.h()}`;main.style.maxWidth=s.sp?'1260px':'980px';if(s.sp){const h2=main.firstChild,sp=document.createElement('div'),L=document.createElement('div'),Rr=document.createElement('div');sp.className='split';L.className='lt';Rr.className='side';[...main.children].filter(x=>x!==h2).forEach(k=>(k.matches('.mv,[data-p]')?Rr:L).append(k));sp.append(L,Rr);main.append(sp)}initSheets(main);s.i&&s.i(main);$$('#nav button').forEach((b,j)=>b.classList.toggle('on',j==i));scrollTo(0,0);$('#nav .on').scrollIntoView({inline:'center',block:'nearest'})};
nav.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#0d2f3b';r.dataset.theme=d?'light':'dark'};go(0);
